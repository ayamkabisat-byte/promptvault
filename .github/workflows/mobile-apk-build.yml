name: Mobile APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - mobile-expo-v1
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-apk-build.yml'

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    env:
      NODE_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Validate Expo dependencies
        run: npx expo install --check

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build standalone release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Verify bundled JavaScript
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          echo "Checking that the standalone JS bundle is packaged in the APK..."
          if ! unzip -l "$APK" | grep -Eq 'assets/index\.android\.bundle|assets/.*\.hbc'; then
            echo "ERROR: JavaScript bundle was not found inside the release APK."
            exit 1
          fi
          echo "Standalone JS bundle found."

      - name: Collect APK
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/release/app-release.apk dist-apk/PromptVault-v0.1.5-standalone.apk
          ls -lh dist-apk/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PromptVault-Android-v0.1.5
          path: mobile/dist-apk/PromptVault-v0.1.5-standalone.apk
          if-no-files-found: error
          retention-days: 14
